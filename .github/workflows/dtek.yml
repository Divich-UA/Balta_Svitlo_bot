name: DTEK графік 2.1

on:
  schedule:
    - cron: "7 * * * *"   # страховка: якщо бот зупинився, GitHub перезапустить
  workflow_dispatch:
    inputs:
      force:
        description: "Одразу надіслати графік у всі чати"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dtek-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Встановити залежності
        run: pip install -r requirements.txt

      - name: Кеш браузера
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Встановити Chromium
        run: python -m playwright install --with-deps chromium

      - name: Налаштувати git
        run: |
          git config user.name "dtek-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Бот працює
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GROUP: "2.1"
          FORCE: ${{ github.event.inputs.force }}
          CHECK_EVERY_SEC: "180"
          RUN_MINUTES: "340"
        run: python bot.py

      - name: Діагностика (якщо був збій)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
